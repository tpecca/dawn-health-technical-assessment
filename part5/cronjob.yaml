# Part 5.2 — Starter: Stale Resource Cleanup CronJob
#
# On a shared AKS cluster, completed and failed pods accumulate over time.
# Kubernetes does provide `ttlSecondsAfterFinished` on Jobs and an automatic
# pod garbage collector. For this task, treat that as a useful but incomplete
# first line of defence: we want a belt-and-braces sweep that catches
# anything missed (Pods orphaned from deleted Jobs, evicted Pods, old Failed
# Pods retained for triage that nobody followed up on).
#
# If you can think of a more interesting target than "Succeeded/Failed pods"
# given the GC already covers most cases (e.g. evicted pods, completed
# Argo Workflows, orphaned ConfigMaps), call that out in SUBMISSION.md.
#
# Your tasks:
#   1. Complete the CronJob so that it:
#      - Runs every hour
#      - Deletes all Succeeded pods across ALL namespaces
#      - Deletes all Failed pods across ALL namespaces
#      - Deletes all completed Jobs (those with status.conditions type=Complete)
#        that are older than 24 hours
#
#   2. Add a ServiceAccount named platform-cleanup-sa in the platform-system
#      namespace (create the Namespace too if you want; do not co-locate
#      platform automation in the argocd namespace).
#
#   3. Add a ClusterRole granting only the permissions this job actually needs
#      (principle of least privilege — think carefully about which verbs and
#      resources are required, and nothing more).
#
#   4. Add a ClusterRoleBinding connecting the ServiceAccount to the ClusterRole.
#
# A Namespace resource is already included below; add the ServiceAccount,
# ClusterRole, and ClusterRoleBinding after it, separated by ---
#
# A couple of things to address in SUBMISSION.md alongside the manifest:
#   - Why a ClusterRole is required here rather than a namespaced Role.
#   - The security implications of granting cluster-wide get/list/delete on
#     pods and jobs in a multi-tenant cluster handling PHI: pod names,
#     labels, owner references, and image tags can leak tenant context.
#     What would you do to mitigate (e.g. audit logging, narrower verb set,
#     specific labelSelector enforcement via an admission policy)?

apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    # Marks this namespace as belonging to the platform team, not a product tenant.
    dawnhealth.com/owner: platform
---
## Dedicated ServiceAccount for the cleanup job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-cleanup-sa
  namespace: platform-system
---
## ClusterRole
# Helps allow cleanup job across namespaces
# Configured with the only minimum required verbs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-cleanup-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
---
## Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-cleanup-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-cleanup-role
subjects:
  - kind: ServiceAccount
    name: platform-cleanup-sa
    namespace: platform-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-stale-resources
  namespace: platform-system
spec:
  schedule: "0 * * * *" # Runs every hour
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: platform-cleanup-sa
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              # Pinned tag. Avoid :latest in any manifest, especially one
              # with cluster-wide delete permissions. The community-maintained
              # alpine/k8s image bundles kubectl and is publicly hosted;
              # verify the tag still tracks your cluster's server version
              # (supported K8s minors as of mid-2026: 1.32, 1.33, 1.34) and
              # pin a digest in production. Note that bitnami/kubectl tags
              # moved behind a subscription in 2024; use
              # bitnamilegacy/kubectl:<tag> if you prefer that lineage.
              image: alpine/k8s:1.33.0
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  echo "[$(date -u)] Step 1: Deleting Succeeded pods across all namespaces..."
                  kubectl delete pods \
                    --field-selector=status.phase=Succeeded \
                    --all-namespaces \
                    --ignore-not-found=true
                  echo "[$(date -u)] Step 1 done."

                  echo "[$(date -u)] Step 2: Deleting Failed pods across all namespaces..."
                  kubectl delete pods \
                    --field-selector=status.phase=Failed \
                    --all-namespaces \
                    --ignore-not-found=true
                  echo "[$(date -u)] Step 2 done."

                  echo "[$(date -u)] Step 3: Deleting completed Jobs older than 24 hours..."
                  ### kubectl has no built-in filter for completionTime, so we use jq
                  ### fromdateiso8601 converts the RFC 3339 completionTime to Unix epoch
                  ### for comparison against our cutoff. The pipeline is safe because
                  ### ignore flag makes each delete idempotent.

                  CUTOFF_EPOCH=$(( $(date +%s) - 86400))
                  kubectl get jobs -all-namespaces -o json | \
                    jq -r --argjson cutoff "$CUTOFF_EPOCH" '
                    .items[] |
                    select(
                      (.status.conditions // []) | any(.type == "Complete")
                    ) |
                    select(
                      .status.completionTime != null and
                      (.status.COmpletionTime | fromdateiso8601) < $cutoff
                    ) |
                    "\(.metadata.namespace)/\(.metadata.name)"
                    ' | while IFS='/' read -r ns name; do
                      echo " Deleting job ${name} in namespace ${ns}"
                      kubectl delete job "${name}" --namespace "${ns}" --ignore-not-found=true
                    done
                  echo "[$(date -u)] Step 3 done."

                  echo "[$(date -u)] Cleanup complete."