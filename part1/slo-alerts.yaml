# Part 1.2 — Starter: Multi-Window SLO Burn-Rate Alerts
#
# SLO: 99.9% of requests to team-alpha-backend succeed over a rolling 28-day window.
# This means the error budget is 0.1% of requests, or approximately 40 minutes
# of complete outage per 28-day window (0.001 * 28 * 24 * 60 ≈ 40.3 min).
#
# Multi-window, multi-burn-rate alerting (Google SRE Workbook §5) avoids the
# pitfalls of simple threshold alerts:
#   - A fast burn alert fires early when the error rate is critically high,
#     even if it has only been happening for a few minutes.
#   - A slow burn alert fires when a lower error rate is sustained long enough
#     to meaningfully erode the 28-day budget.
#
# Burn rate = (observed error rate) / (1 - SLO)
# At a burn rate of 1x, the budget is exhausted exactly at the end of the window.
# For a 99.9% SLO (budget = 0.1%):
#   - 14x burn rate consumes the full 28-day budget in ~2 days
#   - 6x burn rate consumes it in ~4.7 days
#
# Your tasks:
#   1. Complete the PromQL expr for both alerts using the recording rules
#      produced in Part 1.1.
#   2. The burn-rate thresholds are provided in comments — use them correctly.
#   3. Fill in the description and action annotations with meaningful content.
#
# Note on recording rules: Part 1.1 ships 5m and 1h ratios. You will also need
# a 6h ratio for the slow-burn alert. Extend part1/recording-rules.yaml or
# define it inline here (your choice), but document it.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: team-alpha-backend-slo-alerts
  namespace: team-alpha
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: team-alpha-backend:slo
      rules:

        # Fast burn — critical
        # Fires when the error rate is high enough to exhaust the 28-day budget in ~2 days.
        # Uses two windows: a long window (1h) to confirm the trend, and a short window (5m)
        # to confirm it is still happening now. Both must exceed the burn-rate threshold.
        # Threshold for 99.9% SLO: 14x burn rate = error ratio > 0.014 (1.4%)
        - alert: TeamAlphaBackendHighErrorBudgetBurn
          expr: |
            job:http_requests:error_ratio1h{job="team-alpha-backend", namespace="team-alpha"} > 0.014
            and
            job:http_requests:error_ratio5m{job="team-alpha-backend", namespace="team-alpha"} > 0.014            
          for: 2m
          labels:
            severity: critical
            team: team-alpha
            component: backend
          annotations:
            summary: "High error budget burn on {{ $labels.job }} ({{ $value | humanizePercentage }} error rate)"
            description: |
              The 1h error ratio on {{ $labels.job }} in namespace {{ $labels.namespace }}
              exceeds 1.4% — 14x the 0.1% SLO error rate.
              At this burn rate the entire 28-day error budget will be exhausted in approximately 2 days.
              Patient-facing API requests are failing. Treat this as a P1 incident.
            action: |
              Step 1 — Check pod health
              kubectl get pods -n {{ $labels.namespace }} -l app={{ $labels.job }} -o wide
              Look for: non-Running pods, high restart counts, recent AGE resets.

              Step 2 — Check recent logs for errors
              kubectl logs -n {{ $labels.namespace }} -l app={{ $labels.job }} --tail=100 --since=5m

              Step 3 — Check for a recent deployment
              kubectl rollout history deployment/{{ $labels.job }} -n {{ $labels.namespace }}

              If a recent rollout correlates with the alert onset, roll back immediately via ArgoCD:
                1. Open ArgoCD and select {{ $labels.job }}
                2. Go to History and Rollback, select the last known-good revision, click Rollback

              If no recent rollout, continue to Step 4.

              Step 4 — Check for OOMKills
              kubectl describe pods -n {{ $labels.namespace }} -l app={{ $labels.job }} | grep -i oomkill

              If OOMKill confirmed (exit code 137), check the memory trend to distinguish a leak from a traffic spike:
              container_memory_working_set_bytes{namespace="{{ $labels.namespace }}", pod=~"{{ $labels.job }}.*"}

                Memory growing steadily for hours with flat traffic (leak):
                  - Scale out immediately to buy time while the root cause is investigated:
                    kubectl scale deployment/{{ $labels.job }} -n {{ $labels.namespace }} --replicas=6
                  - Page the dev team for emergency investigation.
                  - Re-check rollout history for any deployment in the last 24h:
                    kubectl rollout history deployment/{{ $labels.job }} -n {{ $labels.namespace }}
                    If a deployment is found: roll back via ArgoCD.
                    If not: dev team must hotfix the current version.

                Memory spiked suddenly alongside a traffic increase (traffic spike):
                  - Confirm the request rate is unusually high:
                    sum(rate(http_requests_total{namespace="{{ $labels.namespace }}", job="{{ $labels.job }}"}[5m]))
                  - Check whether the HPA is already scaling to handle the load:
                    kubectl get hpa -n {{ $labels.namespace }}
                  - If HPA has already hit maxReplicas, manually scale beyond it to relieve pressure:
                    kubectl scale deployment/{{ $labels.job }} -n {{ $labels.namespace }} --replicas=10
                  - If traffic looks like a bot or retry storm, investigate the upstream caller
                    and consider rate limiting before scaling further.

              If no OOMKill is found:
                - Check downstream dependencies (database, external APIs) for failures or elevated latency.
                - Check the Azure status page for any active infrastructure incidents.


        # Slow burn — warning
        # Fires when a lower but sustained error rate will exhaust the budget within ~5 days.
        # Uses longer windows: 6h and 30m.
        # Threshold for 99.9% SLO: 6x burn rate = error ratio > 0.006 (0.6%)
        - alert: TeamAlphaBackendMediumErrorBudgetBurn
          expr: |
            job:http_requests:error_ratio6h{job="team-alpha-backend", namespace="team-alpha"} > 0.006
            and
            job:http_requests:error_ratio30m{job="team-alpha-backend", namespace="team-alpha"} > 0.006
          for: 15m
          labels:
            severity: warning
            team: team-alpha
            component: backend
          annotations:
            summary: "Elevated error budget burn on {{ $labels.job }} ({{ $value | humanizePercentage }} error rate)"
            description: |
              The 6h error ratio on {{ $labels.job }} in namespace {{ $labels.namespace }}
              exceeds 0.6% — 6x the 0.1% SLO error rate.
              At this burn rate the full 28-day error budget will be exhausted in approximately 4.7 days.
              This does not require an immediate page — investigate within business hours.
            action: |
              This is a warning. Immediate action is not required but the trend must be
              investigated within business hours to prevent budget exhaustion.

              Step 1 — Assess the trend direction in Grafana
              Open the {{ $labels.job }} SLO dashboard and check whether the error ratio
              is rising, flat, or recovering. A rising trend is more urgent than a flat one.

              Step 2 — Check recent logs for recurring errors
              kubectl logs -n {{ $labels.namespace }} -l app={{ $labels.job }} --since=1h | grep -i error

              Step 3 — Check for a recent deployment that may have introduced the elevated rate
              kubectl rollout history deployment/{{ $labels.job }} -n {{ $labels.namespace }}
              If a deployment correlates with the onset, flag it to the dev team for review.
              A rollback is not required at this severity unless the trend worsens to critical.

              Step 4 — If no deployment found, check downstream dependencies
              Look for elevated latency or error rates in services that {{ $labels.job }} depends on.
              A slow dependency can cause a sustained low-level error rate without triggering
              the fast-burn threshold.

