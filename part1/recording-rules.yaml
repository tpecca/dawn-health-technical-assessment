# Part 1.1 — Starter: SLI Recording Rules
#
# The team-alpha-backend service is a patient-facing REST API.
#
# Recording rules pre-aggregate expensive PromQL expressions so that dashboards
# and alerts evaluate quickly and consistently. The rules below form the
# foundation of the SLO measurement defined in Part 1.2.
#
# The backend exposes standard Prometheus histogram and counter metrics:
#   - http_requests_total{job, namespace, status_code}
#   - http_request_duration_seconds{job, namespace, le}  (histogram)
#
# Your tasks:
#   1. Complete the PromQL expression for each recording rule.
#   2. The naming convention level:metric:operation is intentional, keep it.
#      The metric token should reflect what is actually measured (e.g.
#      http_requests), not a synthesised name like http_errors_total which
#      does not exist as a series.
#   3. Add a comment on each rule explaining what it measures and why it is
#      useful for SLO tracking.
#   4. Part 1.2 needs both 5m and 1h error ratio rules. Both are stubbed below.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: team-alpha-backend-recording-rules
  namespace: team-alpha
  labels:
    # This label must match the ruleSelector on your Prometheus / Mimir ruler.
    # Check your monitoring stack configuration for the correct value.
    release: kube-prometheus-stack
spec:
  groups:
    - name: team-alpha-backend:sli
      interval: 30s
      rules:

        # Request rate — total requests per second over a 5m window,
        # broken down by status code so errors and successes can be separated.
        - record: job:http_requests_total:rate5m
          expr: |
            sum by (job, namespace, status_code) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha"
            }[5m])
            )

        # Error ratio (5m): proportion of 5xx responses relative to all requests,
        # expressed as a value between 0 and 1 (0.001 = 0.1% error rate).
        - record: job:http_requests:error_ratio5m
          expr: |
            sum by (job, namespace) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha",
                status_code=~"5.."
              }[5m])
            )
            /
            sum by (job, namespace) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha"
              }[5m])
            )

        # Error ratio (1h): same calculation as above but over a 1h window.
        # Used by the fast-burn alert in Part 1.2 to confirm a sustained trend
        # before paging.
        - record: job:http_requests:error_ratio1h
          expr: |
            sum by (job, namespace) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha",
                status_code=~"5.."
              }[1h])
            )
            /
            sum by (job, namespace) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha"
              }[1h])
            )

        ## Extended the requested task on part 1.2
        # Error ratio (30m) as a short confirmation before the slow-burn alert
        # Paired with the 6h ratio to confirm if the trend is still active right now
        - record: job:http_requests:error_ratio30m
          expr: |
            sum by (job, namespace) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha",
                status_code=~"5.."
              }[30m])
            )
            /
            sum by (job, namespace) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha"
              }[30m])
            )

        # Error ratio (6h) as the primary long window for the slow-burn alert 
        - record: job:http_requests:error_ratio6h
          expr: |
            sum by (job, namespace) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha",
                status_code=~"5.."
              }[6h])
            )
            /
            sum by (job, namespace) (
              rate(http_requests_total{
                job="team-alpha-backend",
                namespace="team-alpha"
              }[6h])
            )
            
        # p95 latency — 95th percentile request duration over a 5m window.
        # Used to track latency SLIs and identify tail-latency degradation.
        - record: job:http_request_duration_seconds:p95_rate5m
          expr: |
            histogram_quantile(0.95, 
              sum by (job, namespace, le)
                rate(http_request_duration_seconds_bucket{
                  job="team-alpha-backend",
                  namespace="team-alpha"
                }[5m])
              )
