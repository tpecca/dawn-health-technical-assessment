# Part 3.1 — Starter: Reliability Manifests
#
# The team-alpha-backend Deployment is defined below with sensible resource
# requests and limits, health probes, and a named port.
#
# It currently has no autoscaling and no disruption protection — a node drain
# or unexpected traffic spike could take the service down entirely.
#
# Your tasks:
#   1. Add a HorizontalPodAutoscaler (HPA) that:
#      - Targets this Deployment by name
#      - Scales between 2 and 10 replicas
#      - Scales up when average CPU utilisation across pods exceeds 70%
#      - Scales up when average memory utilisation across pods exceeds 80%
#
#      Note: HPA `averageUtilization` is a percentage of the pod's resource
#      requests, not its limits. With requests.cpu: 200m, 70% means an average
#      of 140m per pod across the Deployment. Briefly evaluate whether scaling
#      on memory is appropriate for this workload (see Part 2.2 for the
#      relevant failure mode) and note your reasoning in SUBMISSION.md if you
#      choose to depart from the spec.
#
#   2. Add a PodDisruptionBudget (PDB) that:
#      - Ensures at least 1 pod remains available during voluntary disruptions
#        (node drain, cluster upgrades, etc.)
#      - Is scoped to this Deployment's pods using a label selector
#
# Add both resources to this file, separated by ---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-alpha-backend
  namespace: team-alpha
  labels:
    app: team-alpha-backend
spec:
  # Matches the three-pod incident scenario in Part 2.2. The HPA's minReplicas
  # can scale this down if usage is low.
  replicas: 3
  selector:
    matchLabels:
      app: team-alpha-backend
  template:
    metadata:
      labels:
        app: team-alpha-backend
    spec:
      containers:
        - name: backend
          image: dawnhealthacr.azurecr.io/team-alpha/backend:v1.0.0
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
## HorizontalPodAutoscaler
# Memory scaling caveat (as mentioned in SUBMISSION.md): memory-based scaling is
# implemented as specified but should be removed for this workload in production.
# A memory leak causes memory growth regardless of load; scaling out only adds more
# leaking pods, accelerating cluster-level exhaustion. CPU scaling can be better here
apiVersion: autoscaling/v2 # if we go for CPU scaling in prod later, we can also use v1 API
kind: HorizontalPodAutoscaler
metadata:
  name: team-alpha-backend-hpa
  namespace: team-alpha
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: team-alpha-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: resource
      resource:
        name: cpu
        target:
          type: averageUtilization
          averageUtilization: 70
    - type: resource
      resource:
        name: memory
        target:
          type: averageUtilization
          averageUtilization: 80
---
## PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: team-alpha-backend-pdb
  namespace: team-alpha
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: team-alpha-backend